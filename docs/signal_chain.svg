<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <rect width="960" height="470" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56606d"/></marker>
  </defs>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#161b21">From fingertip to heart rate</text>
  <text x="30" y="62" fill="#5d6876">How one pulse-sensor reading becomes a BPM number. Each box is a step in the firmware.</text>

  <!-- row 1: hardware + sampling -->
  <text x="30" y="100" font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em">ON THE SHIELD</text>
  <text x="400" y="100" font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em">SAMPLING · TIM6 INTERRUPT, 500 Hz</text>

  <g>
    <rect x="30" y="112" width="160" height="78" rx="10" fill="#fdecee" stroke="#ff4d5e"/>
    <text x="110" y="140" text-anchor="middle" font-weight="600" fill="#161b21">IR LED1 → finger</text>
    <text x="110" y="160" text-anchor="middle" fill="#5d6876">blood volume changes</text>
    <text x="110" y="177" text-anchor="middle" fill="#5d6876">the light that returns</text>

    <rect x="210" y="112" width="160" height="78" rx="10" fill="#fdecee" stroke="#ff4d5e"/>
    <text x="290" y="140" text-anchor="middle" font-weight="600" fill="#161b21">Detector + op-amp</text>
    <text x="290" y="160" text-anchor="middle" fill="#5d6876">tiny voltage on A0</text>
    <text x="290" y="177" text-anchor="middle" fill="#5d6876">(a few mV of pulse)</text>

    <rect x="400" y="112" width="160" height="78" rx="10" fill="#eaf2ff" stroke="#1f6fd6"/>
    <text x="480" y="140" text-anchor="middle" font-weight="600" fill="#161b21">ADC ×16</text>
    <text x="480" y="160" text-anchor="middle" fill="#5d6876">16 readings summed,</text>
    <text x="480" y="177" text-anchor="middle" fill="#5d6876">long 247.5-cycle sampling</text>

    <rect x="580" y="112" width="170" height="78" rx="10" fill="#eaf2ff" stroke="#1f6fd6"/>
    <text x="665" y="140" text-anchor="middle" font-weight="600" fill="#161b21">20 ms moving average</text>
    <text x="665" y="160" text-anchor="middle" fill="#5d6876">exactly one 50 Hz period:</text>
    <text x="665" y="177" text-anchor="middle" fill="#5d6876">room-light flicker cancels</text>

    <rect x="770" y="112" width="160" height="78" rx="10" fill="#eaf2ff" stroke="#1f6fd6"/>
    <text x="850" y="140" text-anchor="middle" font-weight="600" fill="#161b21">Keep every 5th</text>
    <text x="850" y="160" text-anchor="middle" fill="#5d6876">500 Hz → 100 Hz</text>
    <text x="850" y="177" text-anchor="middle" fill="#5d6876">(plenty for a heartbeat)</text>
  </g>
  <g stroke="#56606d" stroke-width="1.6" marker-end="url(#a)">
    <line x1="190" y1="151" x2="207" y2="151"/>
    <line x1="370" y1="151" x2="397" y2="151"/>
    <line x1="560" y1="151" x2="577" y2="151"/>
    <line x1="750" y1="151" x2="767" y2="151"/>
    <path d="M850 190 V215 H110 V237" fill="none"/>
  </g>

  <!-- row 2: filtering + detection -->
  <text x="30" y="232" font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em" opacity="0">.</text>
  <text x="140" y="232" font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em">FILTER AND DETECT · 100 Hz</text>
  <g>
    <rect x="30" y="240" width="160" height="78" rx="10" fill="#e9f8ef" stroke="#1fb866"/>
    <text x="110" y="268" text-anchor="middle" font-weight="600" fill="#161b21">High-pass 0.5 Hz</text>
    <text x="110" y="288" text-anchor="middle" fill="#5d6876">drops the DC level</text>
    <text x="110" y="305" text-anchor="middle" fill="#5d6876">and slow drift</text>

    <rect x="210" y="240" width="160" height="78" rx="10" fill="#e9f8ef" stroke="#1fb866"/>
    <text x="290" y="268" text-anchor="middle" font-weight="600" fill="#161b21">Low-pass 4 Hz</text>
    <text x="290" y="288" text-anchor="middle" fill="#5d6876">2nd-order Butterworth,</text>
    <text x="290" y="305" text-anchor="middle" fill="#5d6876">smooths what is left</text>

    <rect x="390" y="240" width="170" height="78" rx="10" fill="#e9f8ef" stroke="#1fb866"/>
    <text x="475" y="268" text-anchor="middle" font-weight="600" fill="#161b21">Polarity</text>
    <text x="475" y="288" text-anchor="middle" fill="#5d6876">steeper edge = heartbeat,</text>
    <text x="475" y="305" text-anchor="middle" fill="#5d6876">flipped to point up</text>

    <rect x="580" y="240" width="170" height="78" rx="10" fill="#fff6dd" stroke="#e0aa00"/>
    <text x="665" y="268" text-anchor="middle" font-weight="600" fill="#161b21">Beat detector</text>
    <text x="665" y="288" text-anchor="middle" fill="#5d6876">crosses 50 % of the peak,</text>
    <text x="665" y="305" text-anchor="middle" fill="#5d6876">≥ 300 ms since the last one</text>

    <rect x="770" y="240" width="160" height="78" rx="10" fill="#fff6dd" stroke="#e0aa00"/>
    <text x="850" y="268" text-anchor="middle" font-weight="600" fill="#161b21">BPM</text>
    <text x="850" y="288" text-anchor="middle" fill="#5d6876">60000 ÷ median of the</text>
    <text x="850" y="305" text-anchor="middle" fill="#5d6876">last 5 beat intervals</text>
  </g>
  <g stroke="#56606d" stroke-width="1.6" marker-end="url(#a)">
    <line x1="190" y1="279" x2="207" y2="279"/>
    <line x1="370" y1="279" x2="387" y2="279"/>
    <line x1="560" y1="279" x2="577" y2="279"/>
    <line x1="750" y1="279" x2="767" y2="279"/>
  </g>

  <!-- outputs -->
  <text x="580" y="362" font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em">WHAT YOU SEE AND HEAR</text>
  <g stroke="#56606d" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M665 318 V370"/>
    <path d="M850 318 V370"/>
  </g>
  <rect x="580" y="374" width="170" height="64" rx="10" fill="#f3f5f8" stroke="#9aa4b0"/>
  <text x="665" y="400" text-anchor="middle" font-weight="600" fill="#161b21">LED flash + beep</text>
  <text x="665" y="420" text-anchor="middle" fill="#5d6876">on every beat (optional)</text>
  <rect x="770" y="374" width="160" height="64" rx="10" fill="#f3f5f8" stroke="#9aa4b0"/>
  <text x="850" y="400" text-anchor="middle" font-weight="600" fill="#161b21">Browser page</text>
  <text x="850" y="420" text-anchor="middle" fill="#5d6876">100 lines per second</text>

  <!-- tiny waveform sketch -->
  <g transform="translate(30,360)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em">THE FILTERED PULSE</text>
    <line x1="0" y1="58" x2="520" y2="58" stroke="#dde2e8"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#e0aa00" stroke-dasharray="6 5"/>
    <path d="M0 64 L30 64 L48 18 L62 40 L74 36 L90 56 L130 64 L160 64 L178 18 L192 40 L204 36 L220 56 L260 64 L290 64 L308 18 L322 40 L334 36 L350 56 L390 64 L420 64 L438 18 L452 40 L464 36 L480 56 L520 64" fill="none" stroke="#1f6fd6" stroke-width="2.2" stroke-linejoin="round"/>
    <g fill="#ff4d5e"><circle cx="41" cy="36" r="5"/><circle cx="171" cy="36" r="5"/><circle cx="301" cy="36" r="5"/><circle cx="431" cy="36" r="5"/></g>
    <text x="0" y="96" font-size="12" fill="#5d6876">blue: signal · dashed: threshold · red dot: beat counted on the way up</text>
  </g>
</svg>
