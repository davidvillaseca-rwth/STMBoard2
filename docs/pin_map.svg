<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">
  <rect width="900" height="620" rx="12" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#161b21">Shield → Nucleo-G474RE pin map</text>
  <text x="30" y="62" font-size="13" fill="#5d6876">Found by testing on the real board (the shield has no published schematic). The OLED row comes from the silkscreen only.</text>

  <!-- column headers -->
  <g font-size="12" font-weight="600" fill="#5d6876" letter-spacing=".05em">
    <text x="30"  y="98">SHIELD PART</text>
    <text x="330" y="98">HEADER PIN</text>
    <text x="500" y="98">MCU PIN</text>
    <text x="640" y="98">PERIPHERAL</text>
  </g>
  <line x1="30" y1="108" x2="870" y2="108" stroke="#dde2e8"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa4b0"/></marker>
  </defs>

  <!-- rows: y = 135 + 38*i -->
  <g id="rows">
    <!-- analog -->
    <g transform="translate(0,135)">
      <circle cx="40" cy="-5" r="7" fill="#ff4d5e"/><text x="56" y="0" fill="#161b21">Pulse sensor (PPG)</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eaf2ff"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#1f6fd6">A0</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PA0</text>
      <text x="640" y="0" fill="#161b21">ADC1_IN1</text>
    </g>
    <g transform="translate(0,173)">
      <circle cx="40" cy="-5" r="7" fill="#4fa3ff"/><text x="56" y="0" fill="#161b21">Potentiometer</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eaf2ff"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#1f6fd6">A1</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PA1</text>
      <text x="640" y="0" fill="#161b21">ADC2_IN2 <tspan fill="#5d6876">(ADC1 is busy with A0)</tspan></text>
    </g>
    <!-- outputs -->
    <g transform="translate(0,211)">
      <circle cx="40" cy="-5" r="7" fill="#e0aa00"/><text x="56" y="0" fill="#161b21">Piezo buzzer</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#fff6dd"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#a37800">D9</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PC7</text>
      <text x="640" y="0" fill="#161b21">TIM3_CH2 PWM (AF2)</text>
    </g>
    <g transform="translate(0,249)">
      <circle cx="40" cy="-5" r="7" fill="#1fb866"/><text x="56" y="0" fill="#161b21">LED2 (green)</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#fff6dd"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#a37800">D6</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PB10</text>
      <text x="640" y="0" fill="#161b21">GPIO out, active high</text>
    </g>
    <g transform="translate(0,287)">
      <circle cx="40" cy="-5" r="7" fill="#ffd23f"/><text x="56" y="0" fill="#161b21">LED3 (yellow)</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#fff6dd"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#a37800">D7</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PA8</text>
      <text x="640" y="0" fill="#161b21">GPIO out, active high</text>
    </g>
    <!-- buttons -->
    <g transform="translate(0,325)">
      <rect x="33" y="-12" width="14" height="14" rx="3" fill="#56606d"/><text x="56" y="0" fill="#161b21">Button UP</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#3b4450">D5</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PB4</text>
      <text x="640" y="0" fill="#161b21">GPIO in, HIGH = pressed</text>
    </g>
    <g transform="translate(0,363)">
      <rect x="33" y="-12" width="14" height="14" rx="3" fill="#56606d"/><text x="56" y="0" fill="#161b21">Button RIGHT</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#3b4450">D4</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PB5</text>
      <text x="640" y="0" fill="#161b21">GPIO in, HIGH = pressed</text>
    </g>
    <g transform="translate(0,401)">
      <rect x="33" y="-12" width="14" height="14" rx="3" fill="#56606d"/><text x="56" y="0" fill="#161b21">Button DOWN</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#3b4450">D3</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PB3</text>
      <text x="640" y="0" fill="#161b21">GPIO in, HIGH = pressed</text>
    </g>
    <g transform="translate(0,439)">
      <rect x="33" y="-12" width="14" height="14" rx="3" fill="#56606d"/><text x="56" y="0" fill="#161b21">Button LEFT</text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#3b4450">D2</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PA10</text>
      <text x="640" y="0" fill="#161b21">GPIO in, HIGH = pressed</text>
    </g>
    <!-- nucleo -->
    <g transform="translate(0,477)">
      <circle cx="40" cy="-5" r="7" fill="#3d7bff"/><text x="56" y="0" fill="#161b21">Blue button B1 <tspan fill="#5d6876">(on the Nucleo)</tspan></text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" fill="#5d6876">—</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PC13</text>
      <text x="640" y="0" fill="#161b21">GPIO in, HIGH = pressed</text>
    </g>
    <g transform="translate(0,515)">
      <circle cx="40" cy="-5" r="7" fill="#8a94a2"/><text x="56" y="0" fill="#161b21">USB serial to the PC <tspan fill="#5d6876">(ST-LINK)</tspan></text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" fill="#5d6876">—</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PA2 / PA3</text>
      <text x="640" y="0" fill="#161b21">LPUART1 (AF12), 115200 8N1</text>
    </g>
    <g transform="translate(0,553)" opacity=".7">
      <rect x="33" y="-12" width="14" height="14" rx="3" fill="none" stroke="#56606d" stroke-dasharray="3 2"/><text x="56" y="0" fill="#161b21">0.96" OLED <tspan fill="#5d6876">(footprint only, not fitted)</tspan></text>
      <line x1="300" y1="-5" x2="325" y2="-5" stroke="#9aa4b0" marker-end="url(#a)"/>
      <rect x="330" y="-20" width="70" height="26" rx="6" fill="#eef0f3"/><text x="365" y="-2" text-anchor="middle" font-weight="600" fill="#3b4450">D14/15</text>
      <text x="500" y="0" font-family="ui-monospace, Consolas, monospace" fill="#161b21">PB9 / PB8</text>
      <text x="640" y="0" fill="#161b21">I2C1 SDA / SCL (unused)</text>
    </g>
  </g>
  <text x="30" y="600" font-size="12" fill="#5d6876">LED1 (the IR emitter under the pulse sensor) is always on; no free pin controls it.</text>
</svg>
