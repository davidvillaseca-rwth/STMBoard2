<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pulse monitor</title>
<style>
 body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}
 header{display:flex;align-items:center;gap:24px;padding:12px 20px}
 button{background:#238636;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:15px;cursor:pointer}
 #bpm{font-size:56px;font-weight:700;min-width:140px}
 #bpm small{font-size:18px;font-weight:400;color:#8b949e}
 #heart{font-size:40px;opacity:.15;transition:opacity .1s}
 #heart.on{opacity:1;color:#f85149}
 #status{color:#8b949e}
 canvas{display:block;width:100%;height:calc(100vh - 130px)}
</style></head><body>
<header>
 <button id="btn">Connect</button>
 <div id="bpm">-- <small>BPM</small></div>
 <div id="heart">&#9829;</div>
 <div id="status">Close PuTTY first, then click Connect and pick the STLink port. Chrome or Edge only.</div>
</header>
<div id="dbg" style="padding:0 20px 6px;color:#8b949e;font:13px monospace">no data yet</div>
<canvas id="c"></canvas>
<script>
const SECONDS = 10, RATE = 100;           // 10 s window, 100 samples/s
const N = SECONDS * RATE;
const raw = new Array(N).fill(null), sm = new Array(N).fill(null), th = new Array(N).fill(null), bt = new Array(N).fill(0);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bpmEl = document.getElementById('bpm'), heart = document.getElementById('heart'), statusEl = document.getElementById('status');

function push(r, s, t, b) {
  raw.push(r); raw.shift(); sm.push(s); sm.shift(); th.push(t); th.shift(); bt.push(b); bt.shift();
}
function draw() {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const vals = raw.concat(sm).filter(v => v !== null);
  if (vals.length > 2) {
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 200) { const m = (hi + lo) / 2; lo = m - 100; hi = m + 100; }
    const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
    const X = i => i * w / (N - 1), Y = v => h - (v - lo) / (hi - lo) * h;
    ctx.strokeStyle = '#21262d'; ctx.lineWidth = 1; ctx.font = '12px system-ui'; ctx.fillStyle = '#8b949e';
    for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4, y = Y(v); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); ctx.fillText(Math.round(v), 4, y - 3); }
    const line = (a, col, wd, dash) => {
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.setLineDash(dash || []);
      let on = false;
      a.forEach((v, i) => { if (v === null) { on = false; return; } on ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)); on = true; });
      ctx.stroke(); ctx.setLineDash([]);
    };
    line(th, '#d29922', 1, [6, 4]); line(sm, '#3fb950', 1.5); line(raw, '#58a6ff', 2);
    ctx.fillStyle = '#f85149';
    bt.forEach((b, i) => { if (b && sm[i] !== null) { ctx.beginPath(); ctx.arc(X(i), Y(sm[i]), 5, 0, 7); ctx.fill(); } });
  }
  requestAnimationFrame(draw);
}
draw();

let port, reader, last = 0, nOk = 0, nOther = 0;
const dbg = document.getElementById('dbg');
document.getElementById('btn').onclick = async () => {
  if (!('serial' in navigator)) { statusEl.textContent = 'Web Serial is not supported here. Use Chrome or Edge.'; return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
  } catch (e) { statusEl.textContent = 'Could not open the port: ' + e.message + ' (is PuTTY still open?)'; return; }
  statusEl.textContent = 'Connected. Green = smoothed signal, yellow dashed = threshold, red dots = beats.';
  document.getElementById('btn').textContent = 'Connected';
  const dec = new TextDecoderStream(); port.readable.pipeTo(dec.writable);
  reader = dec.readable.getReader();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const ln = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!ln.startsWith('P,')) { nOther++; dbg.textContent = 'ok lines: ' + nOk + ' | other lines: ' + nOther + ' | last other: ' + ln.slice(0, 80); continue; }
      const p = ln.split(',').map(Number);
      if (p.length < 6 || p.some(isNaN)) continue;
      push(p[1], p[2], p[3], p[5]);
      nOk++;
      if (nOk % 20 === 0) dbg.textContent = 'ok lines: ' + nOk + ' | other lines: ' + nOther + ' | raw now: ' + p[1] + ' | smoothed: ' + p[2];
      bpmEl.innerHTML = (p[4] ? p[4] : '--') + ' <small>BPM</small>';
      if (p[5]) { heart.classList.add('on'); clearTimeout(last); last = setTimeout(() => heart.classList.remove('on'), 150); }
    }
  }
};
</script></body></html>
